<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Calculator </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Special+Elite&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
</body>
<main class="machine">
  <header class="machine-label">
    <span class="brand">Tally</span>
    <span class="model"> No. 7 Adding Machine</span>
  </header>

  <section class="tape-window" aria-label="Calculation history">
    <div class="tape" id="tape">
      <p class="tape-line tape-empty" id="tapeEmpty">- no entries yet -</p>
    </div>
    </section>
    
    <section class="display-panel">
      <div class="display-secondary" id="displaySecondary" aria-live="polite"></div>
      <div class="display-main" id="displayMain" aria-live="polite"></div>
      </section>

      <section class="keypad" id="keypad">
        <button class="key key-func" data-action="clear">C</button>
        <button class="key key-func" data-action="backspace">⌫</button>
        <button class="key key-func" data-action="percent">%</button>
        <button class="key key-op" data-action="op"  data-op="÷">÷</button>

        <button class="key key-num" data-action="num" data-num="7">7</button>
        <button class="key key-num" data-action="num" data-num="8">8</button>
        <button class="key key-num" data-action="num" data-num="9">9</button>
        <button class="key key-op" data-action="op" data-op="*">*</button>

        <button class="key key-num" data-action="num" data-num="4">4</button>
        <button class="key key-num" data-action="num" data-num="5">5</button>
        <button class="key key-num" data-action="num" data-num="6">6</button>
        <button class="key key-op" data-action="op" data-op="-">-</button>

        <button class="key key-num" data-action="num" data-num="3">3</button>
        <button class="key key-num" data-action="num" data-num="2">2</button>
        <button class="key key-num" data-action="num" data-num="1">1</button>
        <button class="key key-op" data-action="op" data-op="+">+</button>

        <button class="key key-num key-zero" data-action="num" data-num="0">0</button>
      <button class="key key-num" data-action="decimal">.</button>
      <button class="key key-equals" data-action="equals">=</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
