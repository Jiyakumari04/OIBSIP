<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account — Bloom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand-panel">
        <div class="petal-field" aria-hidden="true">
          <span
            class="petal"
            style="left: 10%; animation-duration: 9.5s; animation-delay: 0.5s"
            >🌷</span
          >
          <span
            class="petal"
            style="left: 28%; animation-duration: 8s; animation-delay: 2.5s"
            >🌸</span
          >
          <span
            class="petal"
            style="left: 48%; animation-duration: 10.5s; animation-delay: 1s"
            >🌺</span
          >
          <span
            class="petal"
            style="left: 70%; animation-duration: 9s; animation-delay: 3.5s"
            >🌼</span
          >
          <span
            class="petal"
            style="left: 88%; animation-duration: 11s; animation-delay: 0s"
            >🌷</span
          >
        </div>

        <div class="brand-mark">Bloom<span>.</span></div>

        <div class="flower-illustration" aria-hidden="true">
          <div class="stem"></div>
          <div class="leaf leaf-left"></div>
          <div class="leaf leaf-right"></div>
          <div class="bloom">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
          </div>
        </div>

        <div class="brand-tagline">
          <h2>Plant your account today — it blooms the moment you sign up.</h2>
          <p>
            Passwords never leave your browser in plain text — every password is
            hashed before it's stored.
          </p>
        </div>
      </div>

      <div class="form-panel">
        <div class="form-card">
          <h1>Create your account</h1>
          <p class="subtext">
            Already have one? <a href="index.html">Log in instead</a>
          </p>

          <div class="form-banner" id="formBanner" role="alert"></div>

          <form id="registerForm" novalidate>
            <div class="field" id="usernameField">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                required
                maxlength="24"
                autocomplete="username"
              />
              <p class="field-error" id="usernameError"></p>
            </div>

            <div class="field" id="emailField">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
              />
              <p class="field-error" id="emailError"></p>
            </div>

            <div class="field" id="passwordField">
              <label for="password">Password</label>
              <div class="password-wrap">
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-visibility"
                  data-target="password"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
              <ul class="requirements">
                <li id="reqLength">
                  <span class="req-dot">✓</span> At least 8 characters
                </li>
                <li id="reqNumber">
                  <span class="req-dot">✓</span> At least 1 number
                </li>
              </ul>
            </div>

            <div class="field" id="confirmField">
              <label for="confirmPassword">Confirm password</label>
              <div class="password-wrap">
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  required
                  autocomplete="new-password"
                />
                <button
                  type="button"
                  class="toggle-visibility"
                  data-target="confirmPassword"
                  aria-label="Show password"
                >
                  👁️
                </button>
              </div>
              <p class="field-error" id="confirmError"></p>
            </div>

            <button type="submit" class="btn-primary" id="registerBtn">
              Register
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="auth.js"></script>
    <script>
      (function () {
        const form = document.getElementById("registerForm");
        const usernameInput = document.getElementById("username");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirmPassword");
        const banner = document.getElementById("formBanner");
        const registerBtn = document.getElementById("registerBtn");

        const reqLength = document.getElementById("reqLength");
        const reqNumber = document.getElementById("reqNumber");

        function setBanner(message, type) {
          banner.textContent = message;
          banner.className = `form-banner show ${type}`;
        }

        function clearFieldError(fieldId, errorId) {
          document.getElementById(fieldId).classList.remove("has-error");
          document.getElementById(errorId).textContent = "";
        }

        function setFieldError(fieldId, errorId, message) {
          document.getElementById(fieldId).classList.add("has-error");
          document.getElementById(errorId).textContent = message;
        }

        // Live password requirement checklist
        passwordInput.addEventListener("input", () => {
          const rules = passwordMeetsRules(passwordInput.value);
          reqLength.classList.toggle("met", rules.length);
          reqNumber.classList.toggle("met", rules.hasNumber);
        });

        // Show/hide password toggles
        document.querySelectorAll(".toggle-visibility").forEach((btn) => {
          btn.addEventListener("click", () => {
            const target = document.getElementById(btn.dataset.target);
            const isHidden = target.type === "password";
            target.type = isHidden ? "text" : "password";
            btn.textContent = isHidden ? "🙈" : "👁️";
          });
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          banner.className = "form-banner";

          [
            ["usernameField", "usernameError"],
            ["emailField", "emailError"],
            ["confirmField", "confirmError"],
          ].forEach(([f, err]) => clearFieldError(f, err));

          const username = usernameInput.value.trim();
          const email = emailInput.value.trim();
          const password = passwordInput.value;
          const confirmPassword = confirmInput.value;

          let hasError = false;

          if (!username) {
            setFieldError(
              "usernameField",
              "usernameError",
              "Username is required.",
            );
            hasError = true;
          }

          if (!email) {
            setFieldError("emailField", "emailError", "Email is required.");
            hasError = true;
          } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setFieldError(
              "emailField",
              "emailError",
              "Enter a valid email address.",
            );
            hasError = true;
          }

          if (!isPasswordValid(password)) {
            setBanner(
              "Password must be at least 8 characters and include a number.",
              "error",
            );
            hasError = true;
          }

          if (password !== confirmPassword) {
            setFieldError(
              "confirmField",
              "confirmError",
              "Passwords do not match.",
            );
            hasError = true;
          }

          if (hasError) return;

          registerBtn.disabled = true;
          registerBtn.textContent = "Creating account…";

          const result = await registerUser({ username, email, password });

          if (!result.ok) {
            setBanner(result.message, "error");
            registerBtn.disabled = false;
            registerBtn.textContent = "Register";
            return;
          }

          setBanner("Account created! Redirecting you to log in…", "success");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1100);
        });
      })();
    </script>
  </body>
</html>
